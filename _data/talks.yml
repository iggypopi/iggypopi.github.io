# Talks, one entry per appearance: the same talk at two events is two entries,
# so the page reads as a timeline of where it was given. Dates are the date of
# presentation as YYYY-MM-DD. Upcoming and past split automatically at build
# time, so an entry moves itself from Upcoming to Past on the first deploy
# after its date. Order in this file does not matter; the page sorts by date.
#
# - title: Talk title
#   event: AppSec Village               # the highlighted name on the timeline
#   host: DEF CON 34                    # optional parent event, shown after it
#   city: Las Vegas
#   date: 2026-08-07
#   with: [Co-speaker Name]             # optional co-speakers
#   role: speaker                       # speaker (default) | panel | keynote
#   video: https://www.youtube.com/watch?v=VIDEO_ID   # recording
#   abstract_url: https://...           # agenda or abstract page
#   slides: https://... (or /assets/slides/my-talk.pdf)
#   writeup: /posts/some-post/          # related post on this site
#   recap:                              # optional third-party write-ups
#     - outlet: Some Blog
#       url: https://...
#
# The event name links to the recording when there is one, else to the
# abstract; both are also listed under the talk.

